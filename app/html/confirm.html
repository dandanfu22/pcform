<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PC教室 お申し込みフォーム</title>
  </head>
  <body>
    <header>
      <h1>PC教室お申込みフォーム</h1>
      <h2>お申込み内容のご確認</h2>
    </header>
    <div>
      <p>お名前: <span id="c-name"></span></p>
      <p>フリガナ: <span id="c-furigana"></span></p>
      <p>
        生年月日: <span id="c-year"></span> 年 <span id="c-month"></span> 月
        <span id="c-day"></span> 日
      </p>
      <p>電話番号: <span id="c-tel"></span></p>
      <p>メールアドレス: <span id="c-mail"></span></p>
      <p>参加希望日を選択:</p>
      <p>第一希望日: <span id="c-participationdate1"></span></p>
      <p>第二希望日: <span id="c-participationdate2"></span></p>
      <p>第三希望日: <span id="c-participationdate3"></span></p>
      <p>利用規約に同意します。: <span id="c-termsofservice"></span></p>
      <p>
        プライバシーポリシーに同意します。: <span id="c-privacypolicy"></span>
      </p>
    </div>
    <script src="/app/js/confirum.js"></script>
  </body>
</html>
